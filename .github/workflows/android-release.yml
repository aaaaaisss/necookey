name: Android Installable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: necookey-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('gradle.properties', 'settings.gradle.kts', 'build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Remove unused Sumire converter sources
        run: |
          find vendor/sumire -type f -name '*.gradle' -exec sed -i \
            -e "s/project(':core')/project(':sumireCore')/g" \
            -e "s/project(':custom_keyboard')/project(':sumireCustomKeyboard')/g" \
            -e "s/project(':flexbox')/project(':sumireFlexbox')/g" \
            -e "s/project(':tenkey')/project(':sumireTenkey')/g" \
            -e "s/project(':symbol_keyboard')/project(':sumireSymbolKeyboard')/g" \
            -e "s/project(':gojuon_keyboard')/project(':sumireGojuonKeyboard')/g" \
            -e "s/project(':qwerty_keyboard')/project(':sumireQwertyKeyboard')/g" \
            -e "s/project(':zenz')/project(':sumireZenz')/g" {} +
          rm -f vendor/sumire/app/src/main/res/xml/method.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("vendor/sumire/zenz/build.gradle")
          s = p.read_text()
          s = s.replace('tasks.named("preBuild").configure {\n    dependsOn(prepareZenzModel)\n}\n', "")
          p.write_text(s)
          p = Path("vendor/sumire/app/src/main/java/com/kazumaproject/markdownhelperkeyboard/setting_activity/MainActivity.kt")
          s = p.read_text()
          s = s.replace('            "dictionary_fragment_request" -> {', '            "custom_keyboard_fragment_request" -> {\n                currentNavController().navigate(R.id.keyboardListFragment)\n                true\n            }\n\n            "dictionary_fragment_request" -> {')
          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build installable debug APK
        run: gradle --no-daemon --build-cache --stacktrace :app:assembleDebug

      - name: Verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "Verifying APK: $APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/' || true
          if unzip -l "$APK" | grep -E 'lib/(x86|x86_64)/'; then
            echo "ERROR: x86 ABI is present in the APK"
            exit 1
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: necookey-installable-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
