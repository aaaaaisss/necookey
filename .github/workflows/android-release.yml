name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Remove unused converter sources
        run: |
          rm -f vendor/sumire/app/src/main/java/com/kazumaproject/markdownhelperkeyboard/converter/engine/EnglishEngine.kt
          rm -rf vendor/sumire/app/src/main/java/com/kazumaproject/markdownhelperkeyboard/converter/glide
          rm -rf vendor/sumire/app/src/main/java/com/kazumaproject/markdownhelperkeyboard/converter/english

      - name: Download Gradle
        run: |
          curl -L --fail --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK ABIs
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/' || true
          if unzip -l "$APK" | grep -E 'lib/(x86|x86_64)/'; then
            echo "ERROR: x86 ABI is present in the APK"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: necookey-release-arm
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
