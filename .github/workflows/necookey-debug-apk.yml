name: necookey debug APK

on:
  push:
    branches:
      - sumire-fork
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: necookey-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZENZ_MODEL_CACHE_DIR: ${{ github.workspace }}/.zenz-model-cache
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - name: Checkout (with llama.cpp submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Zenz model
        uses: actions/cache@v4
        with:
          path: .zenz-model-cache
          key: ${{ runner.os }}-zenz-model-v2-4f5423f0fad41a73b1242eb96fe5c12ae4fdca83-Q5_K_M-ggml-model-Q5_K_M.gguf

      - name: Build fullStandard debug APK
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ./gradlew :app:assembleFullStandardDebug --stacktrace --no-daemon --max-workers=2

      - name: Verify no INTERNET permission
        run: |
          APK=$(ls app/build/outputs/apk/fullStandard/debug/*.apk | head -1)
          AAPT=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort | tail -1)
          "$AAPT" dump permissions "$APK" | tee perms.txt
          if grep -q 'android.permission.INTERNET' perms.txt; then echo "INTERNET permission present"; exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: necookey-fullStandard-debug
          path: app/build/outputs/apk/fullStandard/debug/*.apk
          if-no-files-found: error
