name: SUMIRE-LM N-best dump

# sumire-lm ブランチ専用。tools/sumire_lm/ci/trigger.txt を変更して push すると走る。
# JWTD v2 / AJIMEE-Bench / CC-100 はランナー上でダウンロードし、リポジトリには入れない。
# 出力（Sumire top-50 N-best と経路コスト）は短期保持の artifact のみ。
on:
  push:
    branches: [sumire-lm]
    paths: ['tools/sumire_lm/ci/trigger.txt']

permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build eval TSVs + auto-generated clauses
        run: |
          pip install -q fugashi unidic-lite pyahocorasick
          mkdir -p data && cd data
          curl -sSfL -o jwtd.tar.gz https://nlp.ist.i.kyoto-u.ac.jp/nl-resource/JWTD/jwtd_v2.0.tar.gz
          tar xzf jwtd.tar.gz
          git clone -q https://github.com/azooKey/AJIMEE-Bench ajimee
          python ../tools/sumire_lm/build_jwtd.py 3000
          N_AUTO=$(cat ../tools/sumire_lm/ci/n_auto.txt)
          if [ "$N_AUTO" -gt 0 ]; then
            # CC-100 先頭 1.36 GB（圧縮）を展開し、LM 集計に使う先頭 4.5e9 バイトより後ろだけを保存
            curl -sSf -r 0-1359855615 https://data.statmt.org/cc-100/ja.txt.xz | python -c "
          import lzma,sys
          d=lzma.LZMADecompressor(); n=0; SKIP=4500000000
          o=open('holdout.txt','wb')
          while True:
              b=sys.stdin.buffer.read(1<<22)
              if not b: break
              try: x=d.decompress(b)
              except EOFError: break
              if n+len(x)>SKIP: o.write(x[max(0,SKIP-n):])
              n+=len(x)
          print(n)"
            python ../tools/sumire_lm/autogen.py holdout.txt 0 "$N_AUTO" auto.tsv jwtd_kc.tsv ajimee.tsv
            rm holdout.txt
          else
            : > auto.tsv
          fi
          cat ajimee.tsv jwtd_kc.tsv auto.tsv > all.tsv
          wc -l *.tsv
      - uses: actions/upload-artifact@v7
        with:
          name: sumire-lm-inputs
          path: |
            data/jwtd_kc.tsv
            data/ajimee.tsv
            data/auto.tsv
            data/all.tsv
          retention-days: 3

  dump:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-sumire-lm-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-sumire-lm-gradle-
            ${{ runner.os }}-gradle-
      - uses: actions/download-artifact@v7
        with:
          name: sumire-lm-inputs
          path: data
      - name: Dump Sumire N-best (Lite, no zenz)
        env:
          NK_DUMP_IN: ${{ github.workspace }}/data/all.tsv
          NK_DUMP_OUT: ${{ github.workspace }}/cands.${{ matrix.shard }}.tsv
          NK_DUMP_SHARD: ${{ matrix.shard }}/8
        run: |
          cp tools/sumire_lm/ci/SumireNbestDumpTest.kt app/src/test/java/com/kazumaproject/markdownhelperkeyboard/converter/quality/
          ./gradlew :app:testLiteStandardDebugUnitTest --tests '*SumireNbestDumpTest*' -i --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g 2>&1 | grep -E "dumped|fail |FAILED|BUILD|error:|Exception" | head -200
          wc -l cands.${{ matrix.shard }}.tsv
      - uses: actions/upload-artifact@v7
        with:
          name: sumire-lm-cands-${{ matrix.shard }}
          path: cands.${{ matrix.shard }}.tsv
          retention-days: 3
